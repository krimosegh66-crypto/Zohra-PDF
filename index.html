<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زهرة Zohra - المكتبة الرقمية الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
        }
        body {
            background: #f1f5f9;
        }
        /* بطاقات الكتب */
        .book-card {
            background: white;
            border-radius: 1.25rem;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            border-color: #a5b4fc;
        }
        .book-cover {
            height: 180px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 3rem;
            overflow: hidden;
            position: relative;
        }
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-cover .fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
        }
        .price-tag {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .btn-preview {
            background: #eef2ff;
            color: #4338ca;
            transition: 0.2s;
        }
        .btn-preview:hover {
            background: #c7d2fe;
        }
        .btn-download {
            background: #1e293b;
            color: white;
            transition: 0.2s;
        }
        .btn-download:hover {
            background: #0f172a;
        }
        /* أزرار الحروف الأبجدية */
        .alpha-filter button {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            font-weight: 700;
            transition: 0.15s;
            cursor: pointer;
        }
        .alpha-filter button:hover {
            background: #e0e7ff;
            border-color: #6366f1;
        }
        .alpha-filter button.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79,70,229,0.3);
        }
        /* الرأس */
        .header-gradient {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4f46e5);
        }
        .search-box {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            padding: 0.7rem 1rem;
            width: 100%;
            outline: none;
        }
        .search-box input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .search-box button {
            background: #fbbf24;
            color: #1e1b4b;
            font-weight: 700;
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            background: #f59e0b;
        }
        .quick-filter-btn {
            transition: all 0.15s;
            cursor: pointer;
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .quick-filter-btn:hover {
            background: #e0e7ff;
            border-color: #6366f1;
        }
        .quick-filter-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        /* حالة فارغة */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6b7280;
        }
        .empty-state i {
            font-size: 3rem;
            color: #d1d5db;
            margin-bottom: 1rem;
        }
        /* المحرك تبديل */
        .engine-toggle {
            background: #e5e7eb;
            padding: 0.2rem;
            border-radius: 999px;
            display: inline-flex;
            gap: 0.2rem;
        }
        .engine-toggle button {
            border: none;
            background: transparent;
            padding: 0.3rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .engine-toggle button.active {
            background: white;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .engine-toggle button:not(.active):hover {
            background: rgba(255,255,255,0.4);
        }
        .loader {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* رسائل Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 1.5rem;
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            max-width: 90%;
        }
        .toast.success {
            background: #059669;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #2563eb;
        }
        .toast.show {
            display: block;
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        /* الشريط الجانبي */
        .sidebar-scroll {
            max-height: 80vh;
            overflow-y: auto;
        }
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 8px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }
        /* الدليل التعليمي */
        .directory-section {
            background: #0f172a;
            border-radius: 2rem;
        }
        .dir-tab-btn {
            transition: 0.2s;
        }
        .dir-tab-btn.active {
            background: linear-gradient(to right, #059669, #0d9488);
            color: white;
            box-shadow: 0 4px 12px rgba(5,150,105,0.4);
        }
        .dir-tab-btn:not(.active) {
            background: transparent;
            color: #9ca3af;
        }
        .dir-tab-btn:not(.active):hover {
            background: rgba(255,255,255,0.05);
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(30,41,59,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(55,65,81,0.5);
            border-radius: 1.25rem;
            padding: 1.25rem;
            transition: 0.3s;
        }
        .glass-card:hover {
            border-color: #10b981;
        }
        .badge-local {
            background: #10b981;
            color: white;
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            margin-right: 0.5rem;
        }
        .badge-external {
            background: #8b5cf6;
            color: white;
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- ====== الرأس الرئيسي ====== -->
    <header class="header-gradient text-white py-5 px-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fas fa-book-open text-3xl text-yellow-300"></i>
                <div>
                    <h1 class="text-2xl font-extrabold">زهرة <span class="text-yellow-300">Zohra</span></h1>
                    <p class="text-xs text-indigo-200">المكتبة الرقمية الذكية</p>
                </div>
            </div>
            <!-- شريط البحث العلوي -->
            <div class="search-box flex items-center w-full md:w-auto md:min-w-[300px]">
                <i class="fas fa-search text-indigo-300 mx-2"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن كتاب، مؤلف، أو كلمة">
                <button id="searchBtn"><i class="fas fa-arrow-left ml-1"></i> بحث</button>
            </div>
        </div>
        <!-- الفلاتر السريعة -->
        <div class="max-w-7xl mx-auto mt-3 flex flex-wrap items-center gap-2">
            <span class="text-xs text-indigo-200 ml-2">بحث سريع:</span>
            <button class="quick-filter-btn active" data-filter="title">العنوان</button>
            <button class="quick-filter-btn" data-filter="author">المؤلف</button>
            <button class="quick-filter-btn" data-filter="isbn">ISBN</button>
            <span class="text-xs text-indigo-200 mr-auto">المحرك:
                <span class="engine-toggle" id="engineToggle">
                    <button class="active" data-engine="local">📚 داخلي</button>
                    <button data-engine="google">🌐 Google</button>
                </span>
            </span>
            <button id="fetchExternalBtn" class="text-xs bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1 rounded-lg transition">
                <i class="fas fa-sync-alt"></i> تحديث
            </button>
        </div>
    </header>

    <!-- ====== المحتوى الرئيسي ====== -->
    <div class="max-w-7xl mx-auto px-4 py-6">

        <div class="flex flex-col lg:flex-row gap-6">

            <!-- ====== الشريط الجانبي (فلاتر متقدمة) ====== -->
            <aside class="lg:w-72 w-full bg-white rounded-2xl shadow-md p-5 border border-gray-100 sidebar-scroll">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 pb-3 border-b border-gray-100">
                    <i class="fas fa-sliders-h text-indigo-600"></i> تصفية متقدمة
                </h2>
                <div class="space-y-5 mt-4">
                    <!-- سنة النشر -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">سنة النشر</label>
                        <div class="flex gap-2">
                            <input type="number" id="yearFrom" placeholder="من" class="w-1/2 px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-200 outline-none">
                            <input type="number" id="yearTo" placeholder="إلى" class="w-1/2 px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-200 outline-none">
                        </div>
                    </div>
                    <!-- اللغة -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">اللغة</label>
                        <select id="langFilter" class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-200 outline-none bg-white">
                            <option value="">جميع اللغات</option>
                            <option value="ar">العربية</option>
                            <option value="en">الإنجليزية</option>
                            <option value="fr">الفرنسية</option>
                            <option value="de">الألمانية</option>
                            <option value="es">الإسبانية</option>
                        </select>
                    </div>
                    <!-- نوع الإتاحة -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">نوع الإتاحة</label>
                        <div class="flex flex-wrap gap-3">
                            <label class="flex items-center gap-1.5 text-sm">
                                <input type="checkbox" id="chkPreview" class="rounded border-gray-300 text-indigo-600" checked> معاينة مجانية
                            </label>
                            <label class="flex items-center gap-1.5 text-sm">
                                <input type="checkbox" id="chkFulltext" class="rounded border-gray-300 text-indigo-600"> نص كامل
                            </label>
                        </div>
                    </div>
                    <!-- التصنيف -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">التصنيف</label>
                        <select id="categoryFilter" class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-200 outline-none bg-white">
                            <option value="all">جميع التصنيفات</option>
                            <option value="computers">علوم حاسوب</option>
                            <option value="engineering">هندسة</option>
                            <option value="mathematics">رياضيات</option>
                            <option value="physics">فيزياء</option>
                            <option value="literature">أدب</option>
                            <option value="history">تاريخ</option>
                            <option value="philosophy">فلسفة</option>
                        </select>
                    </div>
                    <button id="applyFiltersBtn" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">
                        <i class="fas fa-filter ml-2"></i> تطبيق الفلاتر
                    </button>
                    <button id="resetFiltersBtn" class="w-full text-sm text-gray-500 hover:text-gray-700 underline-offset-2 underline mt-1">
                        إعادة تعيين
                    </button>
                </div>
            </aside>

            <!-- ====== منطقة النتائج ====== -->
            <main class="flex-1">

                <!-- شريط الحروف الأبجدية -->
                <div class="bg-white rounded-2xl shadow-sm p-4 mb-5 border border-gray-100">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-3 flex-wrap">
                        <span class="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <i class="fas fa-sort-alpha-down text-indigo-500"></i> تصفح حسب الحرف:
                        </span>
                        <div class="alpha-filter" id="alphaFilter"></div>
                        <button id="clearAlphaBtn" class="text-sm text-gray-400 hover:text-gray-700 transition">
                            <i class="fas fa-times-circle"></i> إلغاء
                        </button>
                        <span id="externalStatus" class="text-xs text-gray-400 mr-auto hidden">
                            <span id="externalMsg"></span>
                        </span>
                    </div>
                </div>

                <!-- شريط النتائج والترتيب -->
                <div class="flex flex-wrap items-center justify-between bg-white rounded-xl shadow-sm p-3 border border-gray-100 mb-4">
                    <span id="resultCount" class="text-sm text-gray-500">
                        <i class="fas fa-table ml-1"></i> <span id="countNumber">0</span> كتاب
                        <span id="sourceBadge" class="text-xs text-gray-400 mr-2"></span>
                    </span>
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-500">ترتيب:</span>
                        <select id="sortOrder" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:ring-2 focus:ring-indigo-200 outline-none">
                            <option value="default">الافتراضي</option>
                            <option value="title">حسب العنوان</option>
                            <option value="author">حسب المؤلف</option>
                        </select>
                    </div>
                </div>

                <!-- مؤشر التحميل الخارجي -->
                <div id="externalLoader" class="hidden text-center py-4">
                    <div class="loader inline-block"></div>
                    <span class="text-sm text-gray-500 mr-2">جاري البحث في Google Books...</span>
                </div>

                <!-- شبكة الكتب -->
                <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>

                <!-- حالة فارغة -->
                <div id="emptyState" class="empty-state hidden">
                    <i class="fas fa-book-open"></i>
                    <p class="text-lg font-medium">لا توجد كتب تطابق بحثك</p>
                    <p class="text-sm text-gray-400">جرب تغيير كلمات البحث أو اختيار حرف آخر</p>
                    <p id="emptyHint" class="text-xs text-gray-400 mt-2"></p>
                </div>

            </main>
        </div>

        <!-- ====== قسم الدليل التعليمي ====== -->
        <div class="directory-section max-w-6xl mx-auto px-4 py-8 my-8 space-y-6 shadow-2xl">
            <div class="flex items-center gap-2 border-b border-gray-700 pb-4">
                <i class="fa-solid fa-graduation-cap text-emerald-400 text-xl"></i>
                <h2 class="text-xl font-bold text-white">الدليل التعليمي والمكتبات البحثية</h2>
            </div>
            <div class="grid grid-cols-3 gap-3 max-w-2xl mx-auto p-1.5 rounded-2xl bg-gray-800/30 border border-gray-700/50">
                <button onclick="switchDir('schools')" id="btn-schools" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white active">المدارس</button>
                <button onclick="switchDir('universities')" id="btn-universities" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400">الجامعات</button>
                <button onclick="switchDir('libraries')" id="btn-libraries" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400">المكتبات</button>
            </div>
            <div id="directoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pt-4"></div>
        </div>

        <!-- ====== تذييل ====== -->
        <footer class="mt-12 text-center text-sm text-gray-400 border-t border-gray-200 pt-6">
            <p>© 2026 <span class="text-gray-700 font-semibold">زهرة Zohra</span> — محرك داخلي + Google Books</p>
        </footer>
    </div>

    <!-- ====== Toast ====== -->
    <div id="toast" class="toast"></div>

    <!-- ============================================ -->
    <!-- ====== JavaScript المتكامل ====== -->
    <!-- ============================================ -->
    <script>
        (function() {

            // ==============================
            // 1. قاعدة البيانات المحلية
            // ==============================
            const localBooks = [
                { id: 1, title: "أرض زيكولا", author: "عمرو عبد الحميد", year: 2020, category: "رواية", price: "1.00 €", snippet: "رواية خيالية علمية تأخذك إلى عالم موازٍ.", cover: "https://picsum.photos/seed/zikola/400/300" },
                { id: 2, title: "مقدمة ابن خلدون", author: "ابن خلدون", year: 1377, category: "فلسفة وتاريخ", price: "1.00 €", snippet: "الكتاب المؤسس لعلم الاجتماع والتاريخ.", cover: "https://picsum.photos/seed/ibnkh/400/300" },
                { id: 3, title: "لأنك الله", author: "علي بن جابر الفيفي", year: 2018, category: "فكر وروحانيات", price: "1.00 €", snippet: "كتاب روحاني يستعرض أسماء الله الحسنى.", cover: "https://picsum.photos/seed/llah/400/300" },
                { id: 4, title: "البيان والتبيين", author: "الجاحظ", year: 850, category: "أدب وبلاغة", price: "1.00 €", snippet: "موسوعة أدبية وبلاغية من أهم كتب التراث.", cover: "https://picsum.photos/seed/bayan/400/300" },
                { id: 5, title: "الأيام", author: "طه حسين", year: 1929, category: "سيرة ذاتية", price: "1.00 €", snippet: "سيرة عميد الأدب العربي منذ الطفولة.", cover: "https://picsum.photos/seed/ayam/400/300" },
                { id: 6, title: "موسوعة الفلسفة الحديثة", author: "جماعة من الباحثين", year: 2015, category: "فلسفة", price: "1.00 €", snippet: "مرجع شامل يغطي أهم التيارات الفلسفية.", cover: "https://picsum.photos/seed/falsafa/400/300" },
                { id: 7, title: "الذكاء الاصطناعي", author: "د. أحمد المنصور", year: 2023, category: "علوم حاسوب", price: "1.00 €", snippet: "مدخل شامل إلى الذكاء الاصطناعي وتطبيقاته.", cover: "https://picsum.photos/seed/ai/400/300" },
                { id: 8, title: "هندسة البرمجيات", author: "د. سارة الخالدي", year: 2022, category: "هندسة", price: "1.00 €", snippet: "دليل متكامل لمنهجيات تطوير البرمجيات.", cover: "https://picsum.photos/seed/soft/400/300" },
                { id: 9, title: "تاريخ الفلسفة الغربية", author: "د. رامي الحكيم", year: 2021, category: "فلسفة", price: "1.00 €", snippet: "رحلة عبر تطور الفكر الفلسفي من الإغريق.", cover: "https://picsum.photos/seed/phil/400/300" },
                { id: 10, title: "الفيزياء الكمية", author: "د. نادر فوزي", year: 2024, category: "فيزياء", price: "1.00 €", snippet: "شرح مبسط لميكانيكا الكم مع رسوم توضيحية.", cover: "https://picsum.photos/seed/quantum/400/300" },
                { id: 11, title: "تحليل البيانات بـ Python", author: "م. ليلى حسن", year: 2023, category: "علوم حاسوب", price: "1.00 €", snippet: "دليل عملي لتحليل البيانات باستخدام مكتبات Python.", cover: "https://picsum.photos/seed/pyData/400/300" },
                { id: 12, title: "الأدب العباسي", author: "أ. أمل السعدي", year: 2020, category: "أدب", price: "1.00 €", snippet: "دراسة متعمقة للشعر والنثر في العصر العباسي.", cover: "https://picsum.photos/seed/abbasi/400/300" }
            ];

            // ==============================
            // 2. عناصر DOM
            // ==============================
            const grid = document.getElementById('booksGrid');
            const emptyState = document.getElementById('emptyState');
            const emptyHint = document.getElementById('emptyHint');
            const countSpan = document.getElementById('countNumber');
            const sourceBadge = document.getElementById('sourceBadge');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const alphaContainer = document.getElementById('alphaFilter');
            const clearAlphaBtn = document.getElementById('clearAlphaBtn');
            const sortOrder = document.getElementById('sortOrder');
            const fetchBtn = document.getElementById('fetchExternalBtn');
            const externalLoader = document.getElementById('externalLoader');
            const externalStatus = document.getElementById('externalStatus');
            const externalMsg = document.getElementById('externalMsg');
            const toast = document.getElementById('toast');
            const applyFiltersBtn = document.getElementById('applyFiltersBtn');
            const resetFiltersBtn = document.getElementById('resetFiltersBtn');
            const yearFrom = document.getElementById('yearFrom');
            const yearTo = document.getElementById('yearTo');
            const langFilter = document.getElementById('langFilter');
            const categoryFilter = document.getElementById('categoryFilter');
            const chkPreview = document.getElementById('chkPreview');
            const chkFulltext = document.getElementById('chkFulltext');
            const quickFilterBtns = document.querySelectorAll('.quick-filter-btn');

            // ==============================
            // 3. الحالة
            // ==============================
            const state = {
                query: '',
                alpha: null,
                engine: 'local', // 'local' أو 'google'
                externalResults: [],
                isExternalLoading: false,
                externalError: false,
                quickFilter: 'title', // 'title', 'author', 'isbn'
                yearFrom: '',
                yearTo: '',
                lang: '',
                category: 'all',
                preview: true,
                fulltext: false,
            };

            // ==============================
            // 4. دوال مساعدة
            // ==============================
            function showToast(message, type = 'info') {
                toast.className = `toast ${type} show`;
                toast.textContent = message;
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 5000);
            }

            // ==============================
            // 5. البحث عبر Google Books
            // ==============================
            async function fetchGoogleBooks() {
                if (state.isExternalLoading) return;
                state.isExternalLoading = true;
                externalLoader.classList.remove('hidden');
                externalStatus.classList.add('hidden');
                state.externalError = false;

                let query = state.query || 'fiction';
                // إضافة الفلاتر المتقدمة
                if (state.yearFrom) query += `+publishedYear:${state.yearFrom}`;
                if (state.yearTo && state.yearTo >= state.yearFrom) query += `-${state.yearTo}`;
                if (state.lang) query += `+langRestrict:${state.lang}`;
                if (state.category !== 'all') query += `+subject:${state.category}`;

                // إضافة فلتر المؤلف إذا كان محدداً في البحث السريع
                // لكننا نتركه للمستخدم عبر حقل البحث العام

                let url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=16&orderBy=relevance`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    if (data.items && data.items.length > 0) {
                        state.externalResults = data.items.map((item, idx) => {
                            const info = item.volumeInfo || {};
                            const cover = info.imageLinks?.thumbnail?.replace('http:', 'https:') ||
                                `https://picsum.photos/seed/google_${idx}/400/300`;
                            return {
                                id: 'google_' + (item.id || idx),
                                title: info.title || 'عنوان غير معروف',
                                author: info.authors ? info.authors.join('، ') : 'مؤلف مجهول',
                                year: info.publishedDate ? info.publishedDate.substring(0, 4) : 'سنة غير متوفرة',
                                category: info.categories ? info.categories[0] : 'عام',
                                price: 'مجاني / حسب الناشر',
                                snippet: info.description ? info.description.substring(0, 120) + '...' : 'لا يوجد مقتطف',
                                cover: cover,
                                isExternal: true,
                                url: info.previewLink || info.infoLink || '#',
                            };
                        });
                        state.externalError = false;
                        showToast(`✅ تم جلب ${state.externalResults.length} كتاب من Google Books`, 'success');
                        externalMsg.textContent = `✅ تم جلب ${state.externalResults.length} كتاب بنجاح.`;
                        externalStatus.classList.remove('hidden');
                        externalStatus.style.color = '#059669';
                    } else {
                        state.externalResults = [];
                        state.externalError = true;
                        showToast('⚠️ لم يتم العثور على نتائج في Google Books', 'info');
                        externalMsg.textContent = '⚠️ لا توجد نتائج في Google Books.';
                        externalStatus.classList.remove('hidden');
                        externalStatus.style.color = '#d97706';
                    }
                } catch (error) {
                    console.error('Google Books error:', error);
                    state.externalResults = [];
                    state.externalError = true;
                    showToast('⚠️ فشل الاتصال بـ Google Books. استخدم المحرك الداخلي.', 'error');
                    externalMsg.textContent = '❌ فشل الاتصال بـ Google Books. استخدم المحرك الداخلي.';
                    externalStatus.classList.remove('hidden');
                    externalStatus.style.color = '#dc2626';
                } finally {
                    state.isExternalLoading = false;
                    externalLoader.classList.add('hidden');
                    applyFilters();
                }
            }

            // ==============================
            // 6. دوال التصفية والترتيب والعرض
            // ==============================

            function getBooksForEngine() {
                if (state.engine === 'local') {
                    return localBooks.slice();
                } else { // google
                    if (state.externalResults.length > 0) {
                        return state.externalResults.slice();
                    } else {
                        return localBooks.slice();
                    }
                }
            }

            // تصفية حسب النص والحرف والفلاتر المتقدمة
            function filterBooks(books) {
                const q = state.query.trim().toLowerCase();
                const alpha = state.alpha;
                const quickField = state.quickFilter;

                // تطبيق الفلاتر المتقدمة (تُطبق يدوياً على الكتب المحلية)
                // بالنسبة للكتب الخارجية، نعتمد على ما جلبه الـ API، لكننا نضيف تصفية إضافية للنص والحرف

                return books.filter(book => {
                    let matchQuery = true;
                    if (q) {
                        if (quickField === 'title') {
                            matchQuery = book.title.toLowerCase().includes(q);
                        } else if (quickField === 'author') {
                            matchQuery = book.author.toLowerCase().includes(q);
                        } else if (quickField === 'isbn') {
                            // ISBN غير موجود في البيانات المحلية، نبحث في العنوان والمؤلف كحل مؤقت
                            matchQuery = book.title.toLowerCase().includes(q) || book.author.toLowerCase().includes(q);
                        } else {
                            matchQuery = book.title.toLowerCase().includes(q) || book.author.toLowerCase().includes(q) ||
                                (book.snippet || '').toLowerCase().includes(q);
                        }
                    }

                    let matchAlpha = true;
                    if (alpha) {
                        const first = book.title.trim()[0] || '';
                        matchAlpha = (first === alpha);
                    }

                    // فلاتر إضافية للكتب المحلية (السنة، اللغة، التصنيف)
                    // بالنسبة للخارجية نعتمد على ما جاء من API
                    let matchExtra = true;
                    if (!book.isExternal) {
                        // تصفية السنة
                        const from = parseInt(state.yearFrom) || 0;
                        const to = parseInt(state.yearTo) || 0;
                        if (from > 0 && book.year < from) matchExtra = false;
                        if (to > 0 && book.year > to) matchExtra = false;
                        // اللغة (غير مدعومة في البيانات المحلية، نمررها)
                        // التصنيف
                        if (state.category !== 'all' && book.category !== state.category) matchExtra = false;
                        // نوع الإتاحة (غير مدعوم)
                    }

                    return matchQuery && matchAlpha && matchExtra;
                });
            }

            function sortBooks(books) {
                const order = sortOrder.value;
                const sorted = [...books];
                if (order === 'title') {
                    sorted.sort((a, b) => a.title.localeCompare(b.title, 'ar'));
                } else if (order === 'author') {
                    sorted.sort((a, b) => a.author.localeCompare(b.author, 'ar'));
                }
                return sorted;
            }

            function renderBooks(booksList) {
                grid.innerHTML = '';
                if (booksList.length === 0) {
                    emptyState.classList.remove('hidden');
                    countSpan.textContent = '0';
                    if (state.engine === 'google' && state.externalError) {
                        emptyHint.textContent = '💡 تعذر الاتصال بـ Google Books. استخدم المحرك الداخلي.';
                    } else {
                        emptyHint.textContent = '';
                    }
                    let src = (state.engine === 'local') ? 'محلي' : 'Google Books';
                    sourceBadge.textContent = `المصدر: ${src}`;
                    return;
                }
                emptyState.classList.add('hidden');
                countSpan.textContent = booksList.length;

                let localCount = booksList.filter(b => !b.isExternal).length;
                let externalCount = booksList.filter(b => b.isExternal).length;
                let srcText = (state.engine === 'local') ? 'محلي' : `Google Books (${externalCount} كتاب)`;
                if (state.engine === 'google' && externalCount === 0 && localCount > 0) {
                    srcText = 'Google Books (غير متوفر - عرض محلي مؤقت)';
                }
                sourceBadge.textContent = `المصدر: ${srcText}`;

                booksList.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card flex flex-col';

                    const coverDiv = document.createElement('div');
                    coverDiv.className = 'book-cover';
                    const img = document.createElement('img');
                    img.src = book.cover;
                    img.alt = book.title;
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('div');
                        fallback.className = 'fallback';
                        fallback.innerHTML = `<i class="fas fa-book"></i><span>${book.title}</span>`;
                        coverDiv.appendChild(fallback);
                    };
                    coverDiv.appendChild(img);

                    const sourceTag = document.createElement('span');
                    sourceTag.className = 'absolute top-2 right-2 text-[0.5rem] px-2 py-0.5 rounded-full';
                    if (book.isExternal) {
                        sourceTag.classList.add('bg-purple-600', 'text-white');
                        sourceTag.textContent = '🌐 Google';
                    } else {
                        sourceTag.classList.add('bg-emerald-600', 'text-white');
                        sourceTag.textContent = '📚 محلي';
                    }
                    coverDiv.appendChild(sourceTag);

                    const body = document.createElement('div');
                    body.className = 'p-4 flex flex-col flex-grow';

                    const titleEl = document.createElement('h3');
                    titleEl.className = 'text-base font-bold text-gray-800 line-clamp-2';
                    titleEl.textContent = book.title;

                    const authorEl = document.createElement('p');
                    authorEl.className = 'text-sm text-indigo-600 font-medium mt-1';
                    authorEl.textContent = book.author;

                    const snippetEl = document.createElement('p');
                    snippetEl.className = 'text-xs text-gray-500 mt-2 line-clamp-2 flex-grow';
                    snippetEl.textContent = book.snippet || 'لا يوجد مقتطف';

                    const meta = document.createElement('div');
                    meta.className = 'flex items-center justify-between mt-3 pt-2 border-t border-gray-100';
                    const price = document.createElement('span');
                    price.className = 'price-tag';
                    price.textContent = book.price || 'مجاني';
                    const category = document.createElement('span');
                    category.className = 'text-xs text-gray-400';
                    category.textContent = book.category || 'عام';
                    meta.appendChild(price);
                    meta.appendChild(category);

                    const actions = document.createElement('div');
                    actions.className = 'flex gap-2 mt-3';
                    const previewBtn = document.createElement('button');
                    previewBtn.className = 'flex-1 btn-preview text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1';
                    previewBtn.innerHTML = `<i class="fas fa-eye"></i> معاينة`;
                    previewBtn.onclick = () => {
                        if (book.isExternal && book.url) {
                            window.open(book.url, '_blank');
                        } else {
                            alert(`📖 معاينة: ${book.title}\nالمؤلف: ${book.author}\n${book.snippet}`);
                        }
                    };

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'flex-1 btn-download text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1';
                    downloadBtn.innerHTML = `<i class="fas fa-file-pdf"></i> تحميل`;
                    downloadBtn.onclick = () => {
                        if (book.isExternal && book.url) {
                            window.open(book.url, '_blank');
                        } else {
                            alert(`📥 تحميل: ${book.title}\nسيتم توجيهك إلى رابط التحميل.`);
                        }
                    };

                    actions.appendChild(previewBtn);
                    actions.appendChild(downloadBtn);

                    body.appendChild(titleEl);
                    body.appendChild(authorEl);
                    body.appendChild(snippetEl);
                    body.appendChild(meta);
                    body.appendChild(actions);

                    card.appendChild(coverDiv);
                    card.appendChild(body);
                    grid.appendChild(card);
                });
            }

            function applyFilters() {
                let allBooks = getBooksForEngine();
                let filtered = filterBooks(allBooks);
                let sorted = sortBooks(filtered);
                renderBooks(sorted);
            }

            // ==============================
            // 7. إنشاء أزرار الحروف
            // ==============================
            function buildAlphaButtons() {
                const arabicLetters = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'ه', 'و', 'ي'];
                const used = new Set();
                localBooks.forEach(book => {
                    const first = book.title.trim()[0] || '';
                    if (arabicLetters.includes(first)) used.add(first);
                });

                alphaContainer.innerHTML = '';
                arabicLetters.forEach(ch => {
                    if (!used.has(ch)) return;
                    const btn = document.createElement('button');
                    btn.textContent = ch;
                    btn.dataset.letter = ch;
                    btn.addEventListener('click', function() {
                        if (state.alpha === ch) {
                            state.alpha = null;
                            this.classList.remove('active');
                        } else {
                            document.querySelectorAll('.alpha-filter button').forEach(b => b.classList.remove('active'));
                            state.alpha = ch;
                            this.classList.add('active');
                        }
                        applyFilters();
                    });
                    alphaContainer.appendChild(btn);
                });
            }

            // ==============================
            // 8. ربط الأحداث
            // ==============================

            // البحث
            searchInput.addEventListener('input', function() {
                state.query = this.value;
                applyFilters();
            });

            searchBtn.addEventListener('click', function() {
                state.query = searchInput.value;
                applyFilters();
            });

            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    state.query = this.value;
                    applyFilters();
                }
            });

            // الفلاتر السريعة
            quickFilterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    quickFilterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    state.quickFilter = this.dataset.filter;
                    applyFilters();
                });
            });

            // إلغاء الحروف
            clearAlphaBtn.addEventListener('click', function() {
                state.alpha = null;
                document.querySelectorAll('.alpha-filter button').forEach(b => b.classList.remove('active'));
                applyFilters();
            });

            // الترتيب
            sortOrder.addEventListener('change', applyFilters);

            // تبديل المحرك
            document.querySelectorAll('#engineToggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#engineToggle button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    state.engine = this.dataset.engine;

                    if (state.engine === 'google' && state.externalResults.length === 0 && !state
                        .isExternalLoading) {
                        fetchGoogleBooks();
                    } else {
                        applyFilters();
                    }
                });
            });

            // زر تحديث Google Books
            fetchBtn.addEventListener('click', function() {
                if (state.engine === 'local') {
                    showToast('🔄 سيتم التبديل إلى Google Books مؤقتاً للجلب.', 'info');
                    document.querySelectorAll('#engineToggle button').forEach(b => b.classList.remove('active'));
                    document.querySelector('#engineToggle button[data-engine="google"]').classList.add('active');
                    state.engine = 'google';
                }
                fetchGoogleBooks();
            });

            // تطبيق الفلاتر المتقدمة
            applyFiltersBtn.addEventListener('click', function(e) {
                e.preventDefault();
                state.yearFrom = yearFrom.value;
                state.yearTo = yearTo.value;
                state.lang = langFilter.value;
                state.category = categoryFilter.value;
                state.preview = chkPreview.checked;
                state.fulltext = chkFulltext.checked;
                // إذا كان المحرك خارجياً، نعيد الجلب مع الفلاتر الجديدة
                if (state.engine === 'google') {
                    fetchGoogleBooks();
                } else {
                    applyFilters();
                }
            });

            // إعادة تعيين الفلاتر
            resetFiltersBtn.addEventListener('click', function() {
                yearFrom.value = '';
                yearTo.value = '';
                langFilter.value = '';
                categoryFilter.value = 'all';
                chkPreview.checked = true;
                chkFulltext.checked = false;
                state.yearFrom = '';
                state.yearTo = '';
                state.lang = '';
                state.category = 'all';
                state.preview = true;
                state.fulltext = false;
                if (state.engine === 'google') {
                    fetchGoogleBooks();
                } else {
                    applyFilters();
                }
            });

            // ==============================
            // 9. الدليل التعليمي
            // ==============================
            const dirData = {
                schools: [
                    { name: "مدرسة زهرة الأهلية", type: "تعليم أساسي وثانوي", address: "الرياض، حي الياسمين", phone: "+966112345678",
                        email: "info@zohra.edu.sa", map: "https://google.com" },
                    { name: "ثانوية المتفوقين الرقمية", type: "ثانوي - مسار تقني", address: "جدة، حي الخالدية",
                        phone: "+966129876543", email: "contact@smart.edu", map: "https://google.com" }
                ],
                universities: [
                    { name: "جامعة الملك سعود", type: "حكومية بحثية", address: "الرياض، الدرعية", phone: "+966114670000",
                        email: "admissions@ksu.edu.sa", map: "https://google.com" },
                    { name: "جامعة العلوم والتكنولوجيا", type: "أهلية - ذكاء اصطناعي", address: "الدمام، حي الفنار",
                        phone: "+966135558899", email: "research@ustd.edu.sa", map: "https://google.com" }
                ],
                libraries: [
                    { name: "مكتبة الملك فهد الوطنية", type: "وطنية - أطروحات", address: "الرياض، حي العليا",
                        phone: "+966114186111", email: "services@kfnl.gov.sa", map: "https://google.com" },
                    { name: "مكتبة الإسكندرية الرقمية", type: "مكتبة بحثية عالمية", address: "الإسكندرية، الشاطبي",
                        phone: "+2034839999", email: "library@bibalex.org", map: "https://google.com" }
                ]
            };

            function renderDir(cat) {
                const container = document.getElementById('directoryGrid');
                const items = dirData[cat] || [];
                container.innerHTML = '';
                if (!items.length) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-6">لا توجد بيانات.</p>';
                    return;
                }
                items.forEach(item => {
                    container.innerHTML += `
                        <div class="glass-card flex flex-col justify-between group">
                            <div class="space-y-4">
                                <span class="text-[10px] uppercase font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">${item.type}</span>
                                <h3 class="font-bold text-white text-base group-hover:text-emerald-400 transition">${item.name}</h3>
                                <div class="space-y-2.5 text-xs text-gray-400 border-t border-gray-800 pt-3">
                                    <div><i class="fa-solid fa-location-dot text-rose-400 ml-1"></i> ${item.address}</div>
                                    <div><i class="fa-solid fa-phone text-sky-400 ml-1"></i> <a href="tel:${item.phone}" class="hover:text-white">${item.phone}</a></div>
                                    <div><i class="fa-solid fa-envelope text-amber-400 ml-1"></i> <a href="mailto:${item.email}" class="hover:text-white">${item.email}</a></div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-5 pt-3 border-t border-gray-800">
                                <a href="tel:${item.phone}" class="flex items-center justify-center gap-1 bg-gray-800 hover:bg-gray-700 text-gray-200 py-2.5 rounded-xl text-xs font-bold border border-gray-700 transition">📞 اتصال</a>
                                <a href="${item.map}" target="_blank" class="flex items-center justify-center gap-1 bg-gradient-to-r from-gray-700 to-gray-800 hover:from-emerald-600 hover:to-teal-600 text-white py-2.5 rounded-xl text-xs font-bold border border-gray-600/50 transition">🗺️ خريطة</a>
                            </div>
                        </div>
                    `;
                });
            }

            window.switchDir = function(cat) {
                document.querySelectorAll('.dir-tab-btn').forEach(b => {
                    b.className = "dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400 hover:bg-gray-800 hover:text-white transition";
                });
                const active = document.getElementById(`btn-${cat}`);
                if (active) active.className =
                    "dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-600/10 transition";
                renderDir(cat);
            };

            // ==============================
            // 10. التهيئة والعرض الأولي
            // ==============================
            buildAlphaButtons();
            applyFilters();
            renderDir('schools');

            setTimeout(() => {
                showToast('📚 مرحباً بك في زهرة Zohra! المحرك الداخلي يعمل حالياً.', 'info');
            }, 300);

            console.log('✅ زهرة Zohra جاهزة! عدد الكتب المحلية:', localBooks.length);

        })();
    </script>

</body>
