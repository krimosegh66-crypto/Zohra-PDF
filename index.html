<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول الذكي - نسخة محسنة</title>
    <!-- Bootstrap 5 RTL + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js lightweight -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0b0e17;
            color: #e9edf5;
            min-height: 100vh;
            padding: 20px;
        }
        .glass-card {
            background: rgba(20, 27, 45, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
            transition: 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(100, 180, 255, 0.15);
            box-shadow: 0 24px 48px -12px #0a0e1a;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #f0f5ff, #b8ceff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #8b9bb5;
        }
        .badge-status {
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #1f2a3f;
            color: #b4c9f0;
            border: 1px solid #2d3b54;
        }
        .badge-status.active {
            background: #0f2e1f;
            border-color: #2b8f5c;
            color: #7bdfb0;
        }
        .badge-status.inactive {
            background: #2a1f1f;
            border-color: #8f4a4a;
            color: #f59a9a;
        }
        .log-box {
            background: #0d111c;
            border-radius: 20px;
            padding: 16px;
            height: 180px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Cairo', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #b1c3e0;
            border: 1px solid #1f2a3f;
            direction: ltr;
            text-align: left;
            scroll-behavior: smooth;
        }
        .log-box::-webkit-scrollbar { width: 5px; }
        .log-box::-webkit-scrollbar-track { background: #151e2b; border-radius: 10px; }
        .log-box::-webkit-scrollbar-thumb { background: #2f405f; border-radius: 10px; }
        .btn-glow {
            transition: 0.2s;
            border-radius: 60px;
            font-weight: 700;
        }
        .btn-glow:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(70, 130, 255, 0.3);
        }
        .input-dark {
            background: #131b2b;
            border: 1px solid #27344d;
            color: #eef4ff;
            border-radius: 40px;
            padding: 12px 20px;
        }
        .input-dark:focus {
            background: #182132;
            border-color: #4a7aff;
            box-shadow: 0 0 0 3px rgba(74, 122, 255, 0.2);
            color: #fff;
        }
        .input-dark::placeholder {
            color: #5d6f8f;
        }
        .chart-container {
            position: relative;
            height: 90px;
            width: 100%;
            margin-top: 8px;
        }
        .mini-stats {
            background: #111a2b;
            border-radius: 40px;
            padding: 6px 16px;
            border: 1px solid #25324a;
        }
        hr.divider {
            border-color: #1f2a40;
            opacity: 0.4;
        }
        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: #172235;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #8db2ff;
        }
        .fs-7 { font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1150px;">
        <!-- header مع حالة متطورة -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <div class="icon-box"><i class="bi bi-graph-up-arrow"></i></div>
                <div>
                    <h3 class="fw-bold mb-0" style="letter-spacing: -0.5px;">منصة التداول الذكية</h3>
                    <span class="fs-7 text-secondary"><i class="bi bi-dot"></i> استراتيجية Z-Score المتقدمة</span>
                </div>
            </div>
            <div class="d-flex gap-2 align-items-center mt-2 mt-sm-0">
                <span id="status-badge" class="badge-status inactive"><i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i> متوقف</span>
                <span class="mini-stats text-light"><i class="bi bi-activity text-primary me-1"></i><span id="latency-label"> &lt; 1s</span></span>
            </div>
        </div>

        <!-- 4 بطاقات إحصائية محسنة -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="glass-card p-3 text-center">
                    <div class="stat-label"><i class="bi bi-coin me-1"></i> السعر (BTC)</div>
                    <div id="price" class="stat-value">$0.00</div>
                    <small class="text-secondary" id="price-change">+0.00%</small>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="glass-card p-3 text-center">
                    <div class="stat-label"><i class="bi bi-speedometer2 me-1"></i> Z-Score</div>
                    <div id="zscore" class="stat-value">0.00</div>
                    <small class="text-secondary" id="zscore-status">محايد</small>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="glass-card p-3 text-center">
                    <div class="stat-label"><i class="bi bi-briefcase me-1"></i> المركز</div>
                    <div id="position" class="stat-value" style="font-size:1.6rem;">خارج</div>
                    <small class="text-secondary" id="position-size">0.00 BTC</small>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="glass-card p-3 text-center">
                    <div class="stat-label"><i class="bi bi-arrow-left-right me-1"></i> الزوج</div>
                    <div id="symbol" class="stat-value" style="font-size:1.7rem;">BTC/USDT</div>
                    <small class="text-secondary">Binance</small>
                </div>
            </div>
        </div>

        <!-- صف التحكم + الرسم البياني المصغر -->
        <div class="row g-4 mb-4">
            <div class="col-lg-7">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold"><i class="bi bi-sliders2 me-2"></i>إعدادات البوت والتلغرام</span>
                        <span class="badge bg-dark-subtle text-secondary px-3 py-1 fs-7"><i class="bi bi-lock-fill"></i> مشفر</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fs-7 text-secondary">Telegram Bot Token</label>
                            <input type="password" id="telegram_token" class="form-control input-dark" placeholder="•••••••••••">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fs-7 text-secondary">Chat ID</label>
                            <input type="text" id="telegram_chat_id" class="form-control input-dark" placeholder="123456789">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2 mt-3">
                        <button onclick="saveConfig()" class="btn btn-primary btn-glow px-4"><i class="bi bi-check2-circle me-1"></i> حفظ</button>
                        <button onclick="testTelegram()" class="btn btn-outline-info btn-glow px-4"><i class="bi bi-send me-1"></i> اختبار</button>
                        <button onclick="toggleBot()" id="toggle-btn" class="btn btn-success btn-glow px-4 flex-grow-1"><i class="bi bi-play-fill me-1"></i> تشغيل</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="glass-card p-4 h-100 d-flex flex-column">
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold"><i class="bi bi-graph-up me-2"></i>حركة السعر</span>
                        <span class="fs-7 text-secondary">آخر 30 نقطة</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="miniChart" width="300" height="80"></canvas>
                    </div>
                    <div class="d-flex justify-content-between mt-1 fs-7 text-secondary">
                        <span>المتوسط <span id="avg-price">0.00</span></span>
                        <span>التقلب <span id="volatility">0.00%</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- سجل العمليات + زر مسح -->
        <div class="row g-3">
            <div class="col-12">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-terminal me-2"></i>سجل العمليات</h5>
                        <button onclick="clearLogs()" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eraser"></i> مسح</button>
                    </div>
                    <div id="logs" class="log-box"></div>
                </div>
            </div>
        </div>

        <!-- footer خفي -->
        <div class="mt-4 text-center fs-7 text-secondary opacity-50">
            <i class="bi bi-shield-check"></i> جميع البيانات محاكاة · v2.0 · <span id="tick-time"></span>
        </div>
    </div>

    <script>
        // ----- متغيرات الرسم البياني -----
        const ctx = document.getElementById('miniChart').getContext('2d');
        let priceHistory = Array(30).fill(42000);
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(30).fill(''),
                datasets: [{
                    data: priceHistory,
                    borderColor: '#4a7aff',
                    backgroundColor: 'rgba(74, 122, 255, 0.08)',
                    borderWidth: 2.5,
                    pointRadius: 0.8,
                    pointBackgroundColor: '#7aa5ff',
                    tension: 0.3,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false, grid: { display: false } },
                    y: { display: false, grid: { display: false } }
                },
                animation: { duration: 200 }
            }
        });

        // ----- وظائف التحديث -----
        function updateUI() {
            fetch('/api/data')
                .then(r => r.json())
                .then(data => {
                    // تحديث القيم الأساسية
                    document.getElementById('price').innerText = '$' + data.latest_price.toFixed(2);
                    document.getElementById('zscore').innerText = data.latest_zscore.toFixed(2);
                    document.getElementById('symbol').innerText = data.symbol || 'BTC/USDT';

                    // حالة البوت
                    const badge = document.getElementById('status-badge');
                    const btn = document.getElementById('toggle-btn');
                    if(data.running) {
                        badge.className = 'badge-status active';
                        badge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:0.6rem;color:#4cdb8c;"></i> نشط';
                        btn.className = 'btn btn-danger btn-glow px-4 flex-grow-1';
                        btn.innerHTML = '<i class="bi bi-stop-fill me-1"></i> إيقاف';
                    } else {
                        badge.className = 'badge-status inactive';
                        badge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:0.6rem;color:#f58b8b;"></i> متوقف';
                        btn.className = 'btn btn-success btn-glow px-4 flex-grow-1';
                        btn.innerHTML = '<i class="bi bi-play-fill me-1"></i> تشغيل';
                    }

                    // المركز
                    const posEl = document.getElementById('position');
                    if(data.position_open) {
                        posEl.innerText = 'مفتوح';
                        posEl.style.color = '#7bdfb0';
                    } else {
                        posEl.innerText = 'خارج';
                        posEl.style.color = '#f59a9a';
                    }

                    // تحديث السجل
                    const logContainer = document.getElementById('logs');
                    if(data.logs && data.logs.length) {
                        logContainer.innerHTML = data.logs.join('<br>');
                    } else {
                        logContainer.innerHTML = '<span style="color:#4d6185;">⌛ انتظار البيانات...</span>';
                    }
                    logContainer.scrollTop = logContainer.scrollHeight;

                    // تحديث الرسم البياني
                    if(data.latest_price) {
                        priceHistory.push(data.latest_price);
                        if(priceHistory.length > 30) priceHistory.shift();
                        chart.data.datasets[0].data = priceHistory;
                        chart.update('none');
                        // متوسط و تقلب
                        const avg = priceHistory.reduce((a,b)=>a+b,0)/priceHistory.length;
                        document.getElementById('avg-price').innerText = avg.toFixed(2);
                        if(priceHistory.length > 1) {
                            const variance = priceHistory.reduce((a,b)=>a+Math.pow(b-avg,2),0)/priceHistory.length;
                            const vol = Math.sqrt(variance)/avg*100;
                            document.getElementById('volatility').innerHTML = vol.toFixed(2) + '%';
                        }
                        // تغير السعر
                        if(priceHistory.length >= 2) {
                            const change = ((priceHistory[priceHistory.length-1] - priceHistory[priceHistory.length-2]) / priceHistory[priceHistory.length-2] * 100);
                            document.getElementById('price-change').innerHTML = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                            document.getElementById('price-change').style.color = change >= 0 ? '#7bdfb0' : '#f59a9a';
                        }
                    }

                    // حالة Z-Score
                    const z = data.latest_zscore || 0;
                    const zStatus = document.getElementById('zscore-status');
                    if(z > 1.5) zStatus.innerText = '🔥 شراء مفرط';
                    else if(z < -1.5) zStatus.innerText = '❄️ بيع مفرط';
                    else zStatus.innerText = '⚖️ محايد';

                    document.getElementById('tick-time').innerText = new Date().toLocaleTimeString();
                })
                .catch(err => {
                    console.warn('خطأ في التحديث', err);
                    document.getElementById('logs').innerHTML = '⚠️ تعذر الاتصال بالخادم';
                });
        }

        // ----- عمليات التحكم -----
        function saveConfig() {
            const token = document.getElementById('telegram_token').value;
            const chatId = document.getElementById('telegram_chat_id').value;
            fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_token: token, telegram_chat_id: chatId })
            }).then(() => {
                addLog('✅ تم حفظ إعدادات التلغرام');
            }).catch(() => addLog('❌ فشل حفظ الإعدادات'));
        }

        function testTelegram() {
            fetch('/api/test_telegram', {method: 'POST'})
                .then(() => addLog('📨 تم إرسال إشعار تجريبي إلى تلغرام'))
                .catch(() => addLog('❌ فشل إرسال الإشعار'));
        }

        function toggleBot() {
            fetch('/api/toggle', {method: 'POST'})
                .then(() => updateUI())
                .catch(() => addLog('⚠️ تعذر تبديل حالة البوت'));
        }

        function clearLogs() {
            fetch('/api/clear_logs', {method: 'POST'})
                .then(() => {
                    document.getElementById('logs').innerHTML = '';
                    addLog('🧹 تم مسح السجل');
                })
                .catch(() => addLog('❌ فشل مسح السجل'));
        }

        // إضافة سطر للسجل محلياً (للاستجابة السريعة)
        function addLog(msg) {
            const logBox = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<br><span style="color:#8499c4;">[${time}]</span> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // تحديث دوري
        setInterval(updateUI, 2800);
        updateUI();

        // إضافة رسالة ترحيب
        setTimeout(() => {
            addLog('🚀 منصة التداول الذكي جاهزة - استراتيجية Z-Score');
        }, 400);
    </script>
</body>
</html>
